plugins {
	id 'net.fabricmc.fabric-loom'
	id 'maven-publish'
}

base {
	archivesName = "${mod_id}-fabric"
}

def commonProject = project(':common')

sourceSets {
	main {
		java.srcDir(commonProject.file('src/main/java'))
		resources.srcDir(commonProject.file('src/main/resources'))
	}
}

loom {
	runs {
		configureEach { runDir = '../run' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
	def props = [version: project.version, mod_id: mod_id, mod_name: mod_name]
	inputs.properties props
	filesMatching('fabric.mod.json') { expand props }
}

java {
	withSourcesJar()
}

jar {
	def modId = mod_id
	from(rootProject.file('LICENSE')) { rename { "${it}_${modId}" } }
}
